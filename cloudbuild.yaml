  - 'gcr.io/$PROJECT_ID/credit-scoring-backend:latest'
  - 'gcr.io/$PROJECT_ID/credit-scoring-frontend:${_SHORT_SHA}'
  - 'gcr.io/$PROJECT_ID/credit-scoring-frontend:latest'

