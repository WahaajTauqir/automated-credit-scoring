  _DATABASE_URL: 'postgresql://app_user:FireBall24@/credit_scoring?host=/cloudsql/gen-lang-client-0128501968:us-central1:credit-scoring-db'
  _JWT_SECRET: 'Zf9dMXqo_BELTblLCnupbVN7CCL-ZiAwdpq1B4s-pqY'
  _ALLOWED_ORIGINS: 'https://credit-scoring-frontend-475747544204.us-central1.run.app'
  _FRONTEND_API_URL: 'https://credit-scoring-backend-475747544204.us-central1.run.app'
  _HF_TOKEN: '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'
