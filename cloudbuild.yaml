steps:
  # Build backend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/credit-scoring-backend:${_SHORT_SHA}'
      - '-t'
      - 'gcr.io/$PROJECT_ID/credit-scoring-backend:latest'
      - '-f'
      - 'backend/Dockerfile'
      - '.'

  # Build frontend Docker image
  # Note: Backend URL will be set after backend deployment
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'VITE_API_BASE_URL=${_FRONTEND_API_URL}'
      - '-t'
      - 'gcr.io/$PROJECT_ID/credit-scoring-frontend:${_SHORT_SHA}'
      - '-t'
      - 'gcr.io/$PROJECT_ID/credit-scoring-frontend:latest'
      - '-f'
      - 'frontend/Dockerfile'
      - '.'

  # Push backend image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/credit-scoring-backend:${_SHORT_SHA}']
  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/credit-scoring-backend:latest']

  # Push frontend image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/credit-scoring-frontend:${_SHORT_SHA}']
  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/credit-scoring-frontend:latest']

  # Deploy backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'credit-scoring-backend'
      - '--image=gcr.io/$PROJECT_ID/credit-scoring-backend:${_SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--add-cloudsql-instances=${_CLOUD_SQL_INSTANCE}'
      - '--set-env-vars=ENVIRONMENT=production'
      - '--set-env-vars=GCS_UPLOADS_BUCKET=${_GCS_UPLOADS_BUCKET}'
      - '--set-env-vars=GCS_ARTIFACTS_BUCKET=${_GCS_ARTIFACTS_BUCKET}'
      - '--set-env-vars=DATABASE_URL=${_DATABASE_URL}'
      - '--set-env-vars=JWT_SECRET=${_JWT_SECRET}'
      - '--set-env-vars=ALLOWED_ORIGINS=${_ALLOWED_ORIGINS}'
      - '--set-env-vars=HF_TOKEN=${_HF_TOKEN}'
      - '--set-env-vars=HF_TOKEN1=${_HF_TOKEN1}'
      - '--memory=8Gi'
      - '--cpu=2'
      - '--timeout=3600'
      - '--max-instances=10'
      - '--min-instances=0'

  # Deploy frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'credit-scoring-frontend'
      - '--image=gcr.io/$PROJECT_ID/credit-scoring-frontend:${_SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--timeout=300'
      - '--max-instances=10'
      - '--min-instances=0'

